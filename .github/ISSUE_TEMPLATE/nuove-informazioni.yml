name: Nuova informazione o meccanica
description: Documenta una scoperta senza trasformare ipotesi in certezze.
title: "Nuova informazione: "
body:
  - type: textarea
    id: observation
    attributes:
      label: Cosa hai osservato?
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Data e patch di riferimento
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Fonte e passaggi di verifica
      description: Solo evidenze autorizzate e prive di dati personali.
    validations:
      required: true
